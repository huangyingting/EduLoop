<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">图甲（t=1s波形图）与图乙（质元振动图线）</title>
  <desc id="desc">图甲为t=1s时沿x轴负方向传播的简谐横波波形图，图乙为某质元在t=1s时刻经平衡位置向y轴负方向运动的振动图线。</desc>
  <rect width="720" height="420" rx="24" fill="#fffdf8"/>

  <!-- Left panel: 图甲 (Waveform at t = 1s, propagating in -x direction) -->
  <!-- y(x, 1) = -A sin(pi/2 * x): at x=0, y=0; x=1, y=-A; x=2, y=0; x=3, y=+A; x=4, y=0 -->
  <!-- Since wave moves in -x direction, trough at x=1 moves toward x=0, so x=0 moves toward -y at t=1s! -->
  <g transform="translate(35, 45)">
    <text x="155" y="15" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#163a35">图甲（t = 1 s 时的波形图）</text>
    <!-- Axes -->
    <line x1="40" y1="45" x2="40" y2="275" stroke="#163a35" stroke-width="2.5"/>
    <polyline points="34,55 40,43 46,55" fill="none" stroke="#163a35" stroke-width="2.5"/>
    <line x1="25" y1="160" x2="305" y2="160" stroke="#163a35" stroke-width="2.5"/>
    <polyline points="295,154 307,160 295,166" fill="none" stroke="#163a35" stroke-width="2.5"/>
    <text x="25" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#163a35">y</text>
    <text x="312" y="165" font-family="sans-serif" font-size="15" font-weight="700" fill="#163a35">x/m</text>

    <!-- Wave propagation arrow (-x) -->
    <line x1="215" y1="68" x2="135" y2="68" stroke="#c2410c" stroke-width="3"/>
    <polyline points="147,61 133,68 147,75" fill="none" stroke="#c2410c" stroke-width="3"/>
    <text x="175" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">v</text>

    <!-- Sine curve: x=0 at 40, x=1 at 96, x=2 at 152, x=3 at 208, x=4 at 264 -->
    <path d="M 40 160 C 58 160, 74 235, 96 235 C 118 235, 134 160, 152 160 C 170 160, 186 85, 208 85 C 230 85, 246 160, 264 160" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>

    <!-- Tick labels -->
    <text x="30" y="178" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">O</text>
    <text x="96" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">1</text>
    <text x="152" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">2</text>
    <text x="208" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">3</text>
    <text x="264" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">4</text>
  </g>

  <!-- Right panel: 图乙 (Vibration graph y-t: at t=1s, y=0 moving in -y direction) -->
  <g transform="translate(385, 45)">
    <text x="155" y="15" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#163a35">图乙（某质元的振动图线）</text>
    <!-- Axes -->
    <line x1="40" y1="45" x2="40" y2="275" stroke="#163a35" stroke-width="2.5"/>
    <polyline points="34,55 40,43 46,55" fill="none" stroke="#163a35" stroke-width="2.5"/>
    <line x1="25" y1="160" x2="305" y2="160" stroke="#163a35" stroke-width="2.5"/>
    <polyline points="295,154 307,160 295,166" fill="none" stroke="#163a35" stroke-width="2.5"/>
    <text x="25" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#163a35">y</text>
    <text x="312" y="165" font-family="sans-serif" font-size="15" font-weight="700" fill="#163a35">t/s</text>

    <!-- Sine curve: t=0 at 40 (y=0), crest at t=0.5 (96, 85), t=1 at 152 (y=0, going down!), trough at t=1.5 (208, 235), t=2 at 264 (y=0) -->
    <path d="M 40 160 C 58 160, 74 85, 96 85 C 118 85, 134 160, 152 160 C 170 160, 186 235, 208 235 C 230 235, 246 160, 264 160" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>

    <!-- Tick labels -->
    <text x="30" y="178" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">O</text>
    <text x="152" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c2410c">1</text>
    <text x="264" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#163a35">2</text>
  </g>
</svg>
