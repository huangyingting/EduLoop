<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">某生物(2n=6)减数第二次分裂后期细胞示意图</title>
  <desc id="desc">二倍体生物减数第二次分裂后期细胞示意图，上下两极各有4条染色体，其中每极的第2条和第4条染色体互为同源染色体。</desc>
  <rect width="720" height="420" rx="24" fill="#fffdf8"/>
  <rect x="20" y="20" width="680" height="380" rx="18" fill="#fffdf8" stroke="#e5dccb" stroke-width="2"/>

  <!-- Cell boundary (pinched oval in anaphase II) -->
  <path d="M 240 45 C 335 45 405 90 405 155 C 405 185 388 202 380 210 C 388 218 405 235 405 265 C 405 330 335 375 240 375 C 145 375 75 330 75 265 C 75 235 92 218 100 210 C 92 202 75 185 75 155 C 75 90 145 45 240 45 Z" fill="#f8fafc" stroke="#163a35" stroke-width="3.5"/>

  <!-- Centrosomes at poles -->
  <circle cx="240" cy="68" r="7" fill="#163a35"/>
  <circle cx="240" cy="352" r="7" fill="#163a35"/>

  <!-- Spindle fibers -->
  <g stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5" fill="none">
    <line x1="240" y1="68" x2="145" y2="132"/>
    <line x1="240" y1="68" x2="208" y2="132"/>
    <line x1="240" y1="68" x2="272" y2="132"/>
    <line x1="240" y1="68" x2="335" y2="132"/>
    <line x1="240" y1="352" x2="145" y2="288"/>
    <line x1="240" y1="352" x2="208" y2="288"/>
    <line x1="240" y1="352" x2="272" y2="288"/>
    <line x1="240" y1="352" x2="335" y2="288"/>
  </g>

  <!-- Upper pole: 4 daughter chromosomes (V-shapes pointing up) -->
  <!-- #1 Large chromosome -->
  <path d="M 127 170 L 145 132 L 163 170" fill="none" stroke="#163a35" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="132" r="4.5" fill="#fffdf8" stroke="#163a35" stroke-width="2.5"/>
  <text x="145" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#163a35">①</text>

  <!-- #2 Medium chromosome (homologous with #4) -->
  <path d="M 194 162 L 208 132 L 222 162" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="132" r="4.5" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5"/>
  <text x="208" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c2410c">②</text>

  <!-- #3 Small chromosome -->
  <path d="M 262 152 L 272 132 L 282 152" fill="none" stroke="#0f766e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="272" cy="132" r="4" fill="#fffdf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="272" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">③</text>

  <!-- #4 Medium chromosome (homologous with #2) -->
  <path d="M 321 162 L 335 132 L 349 162" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="335" cy="132" r="4.5" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5"/>
  <text x="335" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c2410c">④</text>

  <!-- Lower pole: 4 daughter chromosomes (inverted V-shapes pointing down) -->
  <!-- #1' Large chromosome -->
  <path d="M 127 250 L 145 288 L 163 250" fill="none" stroke="#163a35" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="288" r="4.5" fill="#fffdf8" stroke="#163a35" stroke-width="2.5"/>

  <!-- #2' Medium chromosome -->
  <path d="M 194 258 L 208 288 L 222 258" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="288" r="4.5" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5"/>

  <!-- #3' Small chromosome -->
  <path d="M 262 268 L 272 288 L 282 268" fill="none" stroke="#0f766e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="272" cy="288" r="4" fill="#fffdf8" stroke="#0f766e" stroke-width="2.5"/>

  <!-- #4' Medium chromosome -->
  <path d="M 321 258 L 335 288 L 349 258" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="335" cy="288" r="4.5" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5"/>

  <!-- Explanatory card on the right -->
  <rect x="435" y="95" width="235" height="230" rx="14" fill="#f8f1e3" stroke="#e5dccb" stroke-width="2"/>
  <text x="455" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#163a35">细胞分裂图像特征</text>
  <text x="455" y="168" font-family="sans-serif" font-size="15" fill="#334155">• 生物体细胞：2n = 6</text>
  <text x="455" y="200" font-family="sans-serif" font-size="15" fill="#334155">• 时期：减数第二次分裂后期</text>
  <text x="455" y="232" font-family="sans-serif" font-size="15" fill="#334155">• 每一极均有 4 条染色体</text>
  <text x="455" y="264" font-family="sans-serif" font-size="15" font-weight="600" fill="#c2410c">• 同一极中 ② 与 ④ 形态、</text>
  <text x="470" y="288" font-family="sans-serif" font-size="15" font-weight="600" fill="#c2410c">大小相同</text>
</svg>
