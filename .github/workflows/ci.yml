name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm test
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run data:audit
      - run: npm run seed:verify
      - run: npm run build
      - run: docker build -t eduloop:ci .

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eduloop
          POSTGRES_PASSWORD: eduloop
          POSTGRES_DB: eduloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduloop -d eduloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduloop:eduloop@localhost:5432/eduloop_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate:postgres
      - run: npm run db:deploy:postgres
      - run: npm run test:integration:postgres
