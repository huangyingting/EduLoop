name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      EDULOOP_DATABASE_PROVIDER: sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run env:check
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm test
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run data:verify
      - run: npm run seed:verify
      - run: npm run build
      - run: docker build -t eduloop:ci .

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eduloop
          POSTGRES_PASSWORD: eduloop
          POSTGRES_DB: eduloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduloop -d eduloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduloop:eduloop@localhost:5432/eduloop_test?schema=public
      EDULOOP_DATABASE_PROVIDER: postgresql
      APP_VERSION: ci
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      AUTH_URL: https://eduloop-ci.example
      RESEND_API_KEY: re_ci_placeholder
      AUTH_EMAIL_FROM: EduLoop <accounts@eduloop-ci.example>
      LEGAL_ENTITY_NAME: EduLoop CI
      LEGAL_CONTACT_EMAIL: privacy@eduloop-ci.example
      LEGAL_JURISDICTION: CI test jurisdiction
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate:postgres
      - run: NODE_ENV=production npm run env:check
      - run: npm run db:deploy:postgres
      - run: npm run test:integration:postgres
