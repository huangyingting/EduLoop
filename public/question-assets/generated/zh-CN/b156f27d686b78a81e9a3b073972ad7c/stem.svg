<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">六点线段图</title>
  <desc id="desc">一条直线上依次标有A、B、C、D、E、F六个点。</desc>
  <rect width="720" height="260" rx="24" fill="#fffdf8"/>
  <path d="M62 130 H658" fill="none" stroke="#242136" stroke-linecap="round" stroke-width="6"/>
  <g fill="#f06d5f" stroke="#fffdf8" stroke-width="4">
    <circle cx="110" cy="130" r="9"/><circle cx="210" cy="130" r="9"/><circle cx="310" cy="130" r="9"/>
    <circle cx="410" cy="130" r="9"/><circle cx="510" cy="130" r="9"/><circle cx="610" cy="130" r="9"/>
  </g>
  <g fill="#242136" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="110" y="100">A</text><text x="210" y="100">B</text><text x="310" y="100">C</text>
    <text x="410" y="100">D</text><text x="510" y="100">E</text><text x="610" y="100">F</text>
  </g>
</svg>
