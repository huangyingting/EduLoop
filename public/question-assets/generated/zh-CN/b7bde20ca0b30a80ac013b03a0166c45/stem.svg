<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">矩形纸片ABCD沿对称轴EF折叠示意图</title>
  <desc id="desc">长为70cm的矩形纸片ABCD沿对称轴EF折叠前后的几何示意图，折叠后AB与CD平行且总距离为60cm。</desc>
  <rect width="720" height="420" rx="24" fill="#fffdf8"/>
  <rect x="24" y="24" width="672" height="372" rx="18" fill="#fffdf8" stroke="#e5dccb" stroke-width="2"/>

  <!-- Left: Unfolded rectangle ABCD with symmetry axis EF -->
  <g transform="translate(55, 70)">
    <text x="130" y="0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">折叠前（长 70 cm）</text>
    <rect x="0" y="30" width="260" height="54" fill="#f8f1e3" stroke="#163a35" stroke-width="3"/>
    <!-- Symmetry crease EF -->
    <line x1="130" y1="16" x2="130" y2="98" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="-14" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">A</text>
    <text x="-14" y="90" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">B</text>
    <text x="266" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">D</text>
    <text x="266" y="90" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">C</text>
    <text x="136" y="24" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">E</text>
    <text x="136" y="106" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">F</text>
  </g>

  <!-- Right: Folded stepped figure where AB and CD remain parallel at distance 60 cm -->
  <g transform="translate(385, 65)">
    <text x="140" y="5" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">折叠后形状</text>
    <!-- Horizontal segment AB to E -->
    <rect x="20" y="40" width="140" height="50" fill="#f8f1e3" stroke="#163a35" stroke-width="3"/>
    <!-- Vertical segment after 1st 45° fold -->
    <rect x="110" y="40" width="50" height="145" fill="#fde68a" fill-opacity="0.7" stroke="#163a35" stroke-width="3"/>
    <!-- Lower horizontal segment to CD after 2nd 45° fold -->
    <rect x="110" y="135" width="140" height="50" fill="#f8f1e3" stroke="#163a35" stroke-width="3"/>
    <!-- Crease line EF across the corner -->
    <line x1="110" y1="90" x2="160" y2="135" stroke="#c2410c" stroke-width="3" stroke-dasharray="5 4"/>

    <!-- Labels A, B, E, F, C, D -->
    <text x="4" y="50" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">A</text>
    <text x="4" y="94" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">B</text>
    <text x="92" y="108" font-family="sans-serif" font-size="16" font-weight="700" fill="#c2410c">E</text>
    <text x="166" y="130" font-family="sans-serif" font-size="16" font-weight="700" fill="#c2410c">F</text>
    <text x="256" y="148" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">D</text>
    <text x="256" y="190" font-family="sans-serif" font-size="16" font-weight="700" fill="#163a35">C</text>

    <!-- Distance dimension between AB and CD (60 cm) -->
    <line x1="20" y1="95" x2="20" y2="245" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="250" y1="188" x2="250" y2="245" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="20" y1="232" x2="250" y2="232" stroke="#0f766e" stroke-width="2.5"/>
    <polyline points="30,226 20,232 30,238" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <polyline points="240,226 250,232 240,238" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <text x="135" y="258" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f766e">AB 与 CD 的距离 = 60 cm</text>
  </g>
</svg>
